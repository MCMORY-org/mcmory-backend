# 배포용이다. 레포 루트의 개발용 compose와 다른 파일이라 deploy/ 아래에 둔다 —
# 루트에 두면 로컬에서 `docker compose up`을 칠 때 이쪽이 잡힌다.
# 로컬용은 MySQL만 띄우고, 이쪽은 앱과 MySQL을 함께 띄운다.
#
# CI의 deploy 잡이 이 파일을 EC2로 scp한 뒤 `.env`(ENV 시크릿 전문)를 옆에 쓰고 pull과 up을 돈다.
#
# 이미지 이름은 하드코딩이다. `${DOCKER_IMAGE_NAME}`으로 두면 GitHub 변수가 아니라 EC2의 `.env`에서
# 보간되는데, 그 파일은 ENV 시크릿이 통째로 덮어쓰는 대상이라 키를 늘릴수록 사고 면적이 커진다.
# 레포 변수 DOCKER_IMAGE_NAME과 같은 값이어야 한다 — 한쪽만 고치면 배포가 옛 이미지를 계속 띄운다.
name: mcmory

services:
  app:
    # private 레포다. EC2가 pull하려면 docker login이 선행돼야 하고 deploy 잡이 그것을 한다
    image: kwonseok02/mcmory-backend:latest
    container_name: mcmory-app
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    ports:
      # 루프백에만 바인딩한다. 외부 노출은 nginx(443)가 전담하고 8080은 호스트 밖으로 나가지 않는다.
      # 보안그룹에서 8080을 지우는 것만으로는 규칙이 되살아나면 다시 열리므로 경로 자체를 없앤다
      - "127.0.0.1:8080:8080"
    volumes:
      # FR-012 편지 사진. 볼륨이 없으면 재배포마다 이미 보낸 선물의 사진이 깨진다.
      # 컨테이너 안 경로는 LETTER_IMAGES_DIR과 맞춰야 한다(application.yml 기본값 ./var/letter-images)
      - mcmory_letter_images:/app/var/letter-images
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: mcmory-mysql
    command: ["--skip-log-bin", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: mcmory_java
    volumes:
      - mcmory_mysql:/var/lib/mysql
      # ponytail: 스키마 초기 적재를 compose에 붙이지 않는다. init 마운트는 볼륨이 빌 때만 도는
      # **일회성** 동작이라 배포 파이프라인에 상주시킬 값이 없고, deploy 잡이 스키마 파일까지
      # scp하도록 만들면 경로 의존이 하나 더 는다.
      #
      # **대신 신규 인스턴스에서 딱 한 번 손으로 적재한다.** 앱이 ddl-auto: validate라
      # 이 절차를 빠뜨리면 기동 자체가 실패해 재시작 루프에 빠진다.
      #
      #   scp src/test/resources/db/01-schema.sql deploy/03-deploy-seed.sql ubuntu@$EC2_HOST:/tmp/
      #   ssh ubuntu@$EC2_HOST 'for f in 01-schema 03-deploy-seed; do \
      #     docker exec -i mcmory-mysql mysql -uroot -p"$DB_ROOT_PASSWORD" \
      #     --default-character-set=utf8mb4 mcmory_java < /tmp/$f.sql; done'
      #
      # --default-character-set=utf8mb4를 빼면 한글이 깨져 들어간다(클라이언트 기본값이 latin1).
      # 이후의 스키마 변경도 같은 방식으로 ALTER TABLE을 직접 건다.
      #
      # 시드는 이 폴더의 03-deploy-seed.sql만 적재한다. src/test/resources/db/02-seed.sql을 쓰지 말 것 —
      # 그쪽 회원 시드의 로그인 계정이 README에 공개돼 있어 누구나 그 계정으로 들어올 수 있다.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$DB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  mcmory_mysql:
  mcmory_letter_images:
