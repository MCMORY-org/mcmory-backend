# 로컬 기본값은 프로토타입 DB(prototype/compose.yml)의 컨테이너를 보되 데이터베이스는 mcmory_java로 가른다.
# 포트 3307은 다른 MySQL과 겹치지 않게 고른 값이다.
# 여기 기본값은 전부 로컬 편의값이고 배포에서는 환경변수로 덮는다. 배포 compose가 읽는
# DB_ROOT_PASSWORD만 기본값이 없어 주입하지 않으면 아예 뜨지 않는다.
spring:
  application:
    name: mcmory-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/mcmory_java?characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mcmory}
  servlet:
    multipart:
      # ADR-008의 7번: 파일당 10MB, 최대 5장. 서버 상한을 함께 걸어 큰 파일이 서비스 검증까지 오지 않게 한다
      max-file-size: 10MB
      # 10MB 5장에 multipart 헤더와 경계까지 얹으면 50MB를 살짝 넘어 계약상 허용 조합이 거부됨. 여유를 둠
      max-request-size: 52MB
  jpa:
    hibernate:
      # 스키마 정본은 db/init/01-schema.sql이다. 애플리케이션이 덮어쓰지 않게 validate로 둔다
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# ADR-013 인증 설정. 유예창 기본값 30초 — 이 값이 ADR-013 결정 9의 1항 표기와 어긋나면
# 프론트가 재시도 타이밍을 오해한다. 고칠 때 문서도 함께 고칠 것.
app:
  auth:
    # **이 기본값은 public 레포에 공개돼 있다.** 배포에서 JWT_SECRET을 주입하지 않으면
    # 누구나 토큰을 위조할 수 있다. HMAC-SHA256 키라 32바이트 이상이어야 한다
    jwt-secret: ${JWT_SECRET:mcmory-prototype-dev-secret-key-change-in-deploy}
    access-ttl: 30m
    refresh-ttl: 1d
    cookie:
      same-site: Lax
      # 웹뷰 로컬 검증은 http://10.0.2.2로 붙고 그 호스트는 secure context가 아니라 쿠키가 통째로 죽는다.
      # 배포 프로파일에서만 true로 올린다
      secure: ${COOKIE_SECURE:false}
    refresh:
      grace-seconds: 30
    # ADR-013 결정 7의 Origin 검사에서 추가로 허용할 출처. 같은 호스트는 값 없이도 통과한다
    allowed-origins: ${ALLOWED_ORIGINS:}
  letter-images:
    # FR-012 편지 사진 저장 위치다. 로컬 디스크라 재배포하면 사라진다 — 배포 compose에서 볼륨을 붙인다(OPS-W001 T4)
    dir: ${LETTER_IMAGES_DIR:./var/letter-images}

management:
  endpoints:
    web:
      exposure:
        include: health
