# 기본값은 전부 로컬 편의값이고 배포에서는 환경변수로 덮는다. 포트 3307은 다른 MySQL과 겹치지 않게 고른 값이라,
# 여기를 바꾸면 compose.yml도 함께 바꿔야 팀원이 env 없이 뜬다.
spring:
  application:
    name: mcmory-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/mcmory_java?characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mcmory}
  servlet:
    multipart:
      # ADR-008의 7번: 파일당 10MB, 최대 5장. 서버 상한을 함께 걸어 큰 파일이 서비스 검증까지 오지 않게 한다
      max-file-size: 10MB
      # 10MB 5장에 multipart 헤더와 경계까지 얹으면 50MB를 살짝 넘어 계약상 허용 조합이 거부됨. 여유를 둠
      max-request-size: 52MB
  jpa:
    hibernate:
      # 스키마 정본은 src/test/resources/db/01-schema.sql이다. 애플리케이션이 덮어쓰지 않게 validate로 둔다
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# ADR-013 인증 설정. 유예창 기본값 30초 — 이 값과 문서 표기가 어긋나면
# 프론트가 재시도 타이밍을 오해한다(campus가 5초로 잘못 적었다 정정한 이력). 문서 표기는 ADR-013 결정 9의 1항이다.
app:
  auth:
    # **이 기본값은 public 레포에 공개돼 있다.** 배포에서 JWT_SECRET을 주입하지 않으면
    # 누구나 토큰을 위조할 수 있다. HMAC-SHA256 키라 32바이트 이상이어야 한다
    jwt-secret: ${JWT_SECRET:mcmory-prototype-dev-secret-key-change-in-deploy}
    access-ttl: 30m
    refresh-ttl: 1d
    cookie:
      same-site: Lax
      # 웹뷰 로컬 검증은 http://10.0.2.2로 붙고 그 호스트는 secure context가 아니라 쿠키가 통째로 죽는다.
      # 배포 프로파일에서만 true로 올린다
      secure: ${COOKIE_SECURE:false}
    refresh:
      grace-seconds: 30
    # ADR-013 결정 7의 Origin 검사에서 추가로 허용할 출처. 같은 호스트는 값 없이도 통과한다
    allowed-origins: ${ALLOWED_ORIGINS:}
  letter-images:
    # FR-012 편지 사진 저장 위치다. 로컬 디스크라 배포에서는 deploy/compose.yml의 named volume이
    # 이 경로를 받아야 재배포에도 살아남는다. 파일이 더 오래 살아야 하면 오브젝트 스토리지로 옮긴다
    dir: ${LETTER_IMAGES_DIR:./var/letter-images}

# FR-023 스타일링 근거 문구를 AWS Bedrock으로 쓸지다(FEAT-W002).
#
# **기본값이 false다.** 꺼져 있으면 Bedrock 빈이 아예 안 만들어지고 규칙 문구로 폴백하므로,
# 로컬과 테스트는 외부 호출이 0건이고 결과가 결정론적이다. 켜려면 자격증명이 필요한데
# 키를 넣지 않고 EC2 IAM 인스턴스 프로파일로 준다(컨테이너에서 닿으려면 IMDSv2 hop limit이 2여야 한다).
#
# model-id는 **추론 프로파일 id**여야 한다 — 맨 id(amazon.nova-pro-v1:0)는 ValidationException이다.
#
# **nova-lite를 쓰지 말 것.** 2026-08-11 실측에서 lite는 길이 지시를 못 지켜 41에서 63자를 냈고,
# 40자 검증에 전부 걸려 LLM이 실질적으로 한 번도 쓰이지 않았다. pro는 같은 프롬프트에 25·38·33자였다.
bedrock:
  enabled: ${BEDROCK_ENABLED:false}
  region: ${BEDROCK_REGION:ap-northeast-2}
  model-id: ${BEDROCK_MODEL_ID:apac.amazon.nova-pro-v1:0}
  # 재시도를 포함한 총량이다. 넘으면 규칙 문구로 폴백하므로 사용자 체감 상한도 이 값이다
  timeout-millis: ${BEDROCK_TIMEOUT_MILLIS:2500}

management:
  endpoints:
    web:
      exposure:
        include: health
